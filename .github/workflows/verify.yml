name: Verify Qarzhy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: qarzhy_ci
          POSTGRES_USER: qarzhy_ci
          # Disposable CI service only; never a production credential.
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qarzhy_ci -d qarzhy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qarzhy_ci:ci_ephemeral_only@127.0.0.1:5432/qarzhy_ci?schema=public
      REGISTRATION_TEST_DATABASE_URL: postgresql://qarzhy_ci:ci_ephemeral_only@127.0.0.1:5432/qarzhy_test_registration_ci?schema=public
      APP_URL: http://127.0.0.1:3100
      COOKIE_SECURE: 'false'
      ALLOW_REGISTRATION: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      LIVE_GEMINI_TEST: 'false'
      LOW_MEMORY_TESTS: 'true'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check publication boundaries
        run: npm run check:publish
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Package production browser assets
        run: |
          cp -R public .next/standalone/
          cp -R .next/static .next/standalone/.next/
      - name: Prepare a separate disposable registration database
        env:
          PGPASSWORD: ci_ephemeral_only
        run: |
          psql -h 127.0.0.1 -p 5432 -U qarzhy_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE qarzhy_test_registration_ci;'
          DATABASE_URL="$REGISTRATION_TEST_DATABASE_URL" npm run db:migrate
      - name: Verify open registration against the production build
        env:
          REGISTRATION_TEST_MODE: open
        run: npx playwright test --config=playwright.registration.config.ts
      - name: Verify closed registration against the same production build
        env:
          REGISTRATION_TEST_MODE: closed
        run: npx playwright test --config=playwright.registration.config.ts
      - name: Start the production build against the disposable database
        shell: bash
        run: |
          HOSTNAME=127.0.0.1 PORT=3100 node .next/standalone/server.js > "$RUNNER_TEMP/qarzhy-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
      # No deploy, production secrets, database dumps or artifact uploads here.
      # Vercel Git integration is connected only after reviewing the report.
